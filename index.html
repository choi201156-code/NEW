<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 키워드 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --text: #1d1d1b; --muted: #6d6d68;
    --line: #e4e4de; --accent: #03a64a; --chip: #ececE6;
    --s-정치: #3b5bdb; --s-경제: #e8590c; --s-사회: #2b8a3e; --s-세계: #7048e8;
    --s-IT: #0c8599; --s-생활: #c2255c; --s-기타: #868e96;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --text: #ededea; --muted: #9a9a94;
            --line: #2f2f2c; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Noto Sans KR", system-ui, sans-serif; line-height: 1.5; }
  header { background: var(--card); border-bottom: 1px solid var(--line);
           position: sticky; top: 0; z-index: 5; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  select, input { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input { width: 100%; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 0; scrollbar-width: none; }
  .tab { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500;
         padding: 10px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--text); border-color: var(--accent); }
  .tab small, .chip small { font-size: 11px; font-weight: 500; margin-left: 5px; padding: 0 6px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .chip.on small { background: rgba(127,127,127,.35); color: inherit; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 16px 0 8px; }
  .chip { border: 0; background: var(--chip); color: var(--text); font: inherit; font-size: 13px;
          padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .chip.on { background: var(--text); color: var(--bg); }
  .search { padding: 4px 0 12px; }
  .meta { color: var(--muted); font-size: 12px; padding-bottom: 8px; }
  .list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .item a.t { color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px; }
  .item a.t:hover { text-decoration: underline; }
  .item p { margin: 6px 0 8px; color: var(--muted); font-size: 14px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .sec { color: #fff; font-weight: 500; padding: 1px 8px; border-radius: 4px; font-size: 11px; }
  .info a { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>오늘의 <span>키워드</span> 뉴스</h1>
      <select id="date" aria-label="날짜 선택"></select>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <div class="bar" id="sections"></div>
  <div class="search"><input id="q" type="search" placeholder="기사 제목·내용 검색"></div>
  <div class="meta" id="meta"></div>
  <div class="list" id="list"></div>
</main>
<script>
const ORDER = ["정치", "경제", "사회", "세계", "IT/과학", "생활/문화", "연예", "스포츠", "기타"];
const COLOR = s => getComputedStyle(document.documentElement)
  .getPropertyValue("--s-" + s.split("/")[0].trim()) || "var(--s-기타)";
const state = { data: null, kw: "전체", sec: "전체", q: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadDates() {
  try {
    const { dates } = await (await fetch("data/index.json", { cache: "no-store" })).json();
    $("date").innerHTML = dates.map(d => `<option>${d}</option>`).join("");
    if (dates.length) loadDay(dates[0]);
    else $("list").innerHTML = `<div class="empty">아직 수집된 기사가 없어요.</div>`;
  } catch {
    $("list").innerHTML = `<div class="empty">데이터를 불러오지 못했어요. 수집이 한 번 실행됐는지 확인해 주세요.</div>`;
  }
}

async function loadDay(date) {
  state.data = await (await fetch(`data/${date}.json`, { cache: "no-store" })).json();
  render();
}

function allArticles() {
  // 여러 키워드에 걸린 같은 기사는 하나로 합치고 키워드 목록만 모음
  const map = new Map();
  for (const [kw, arr] of Object.entries(state.data.keywords))
    for (const a of arr) {
      if (map.has(a.url)) map.get(a.url).kws.push(kw);
      else map.set(a.url, { ...a, kws: [kw] });
    }
  return [...map.values()];
}

const MAIN = ["정치", "경제", "사회", "세계", "IT/과학", "생활/문화"];

function render() {
  const all = allArticles();
  const secCount = {};
  all.forEach(a => secCount[a.section] = (secCount[a.section] || 0) + 1);

  // 섹션 탭 (네이버처럼 주요 섹션은 항상 표시, 나머지는 기사가 있을 때만)
  const tabs = ["전체", ...ORDER.filter(s => MAIN.includes(s) || secCount[s])];
  $("tabs").innerHTML = tabs.map(s => {
    const n = s === "전체" ? all.length : (secCount[s] || 0);
    return `<button class="tab ${s === state.sec ? "on" : ""}" data-sec="${s}">${s}<small>${n}</small></button>`;
  }).join("");

  const inSec = all.filter(a => state.sec === "전체" || a.section === state.sec);

  // 키워드 칩 (현재 섹션 안에서의 개수)
  const kwCount = {};
  inSec.forEach(a => a.kws.forEach(k => kwCount[k] = (kwCount[k] || 0) + 1));
  const kws = Object.keys(state.data.keywords).filter(k => kwCount[k]);
  if (state.kw !== "전체" && !kwCount[state.kw]) state.kw = "전체";
  $("sections").innerHTML = [`<button class="chip ${state.kw === "전체" ? "on" : ""}" data-kw="전체">모든 키워드 <small>${inSec.length}</small></button>`,
    ...kws.map(k => `<button class="chip ${k === state.kw ? "on" : ""}" data-kw="${esc(k)}">#${esc(k)} <small>${kwCount[k]}</small></button>`)].join("");

  // 목록
  const q = state.q.trim().toLowerCase();
  const list = inSec
    .filter(a => state.kw === "전체" || a.kws.includes(state.kw))
    .filter(a => !q || (a.title + a.description).toLowerCase().includes(q))
    .sort((a, b) => b.published.localeCompare(a.published));

  const gen = new Date(state.data.generated_at);
  $("meta").textContent = `${list.length}건 · ${gen.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" })} 수집`;

  $("list").innerHTML = list.length ? list.map(a => {
    const t = new Date(a.published).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    return `<article class="item">
      <a class="t" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
      <p>${esc(a.description)}</p>
      <div class="info">
        <span class="sec" style="background:${COLOR(a.section)}">${esc(a.section)}</span>
        <span>${esc(a.press)}</span><span>${t}</span>
        ${a.kws.map(k => `<span>#${esc(k)}</span>`).join("")}
        ${a.naver_url ? `<a href="${esc(a.naver_url)}" target="_blank" rel="noopener">네이버에서 보기</a>` : ""}
      </div></article>`;
  }).join("") : `<div class="empty">이 섹션에는 오늘 기사가 없어요.</div>`;
}

$("tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) { state.sec = b.dataset.sec; state.kw = "전체"; render(); } };
$("sections").onclick = e => { const b = e.target.closest(".chip"); if (b) { state.kw = b.dataset.kw; render(); } };
$("q").oninput = e => { state.q = e.target.value; render(); };
$("date").onchange = e => loadDay(e.target.value);
loadDates();
</script>
</body>
</html>
