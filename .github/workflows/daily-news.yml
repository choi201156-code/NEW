name: 매일 뉴스 수집

on:
  schedule:
    - cron: "0 22 * * *"   # 한국시간 오전 7시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          mkdir -p docs/data && cp -r data/. docs/data/ 2>/dev/null || true
          python fetch_news.py
          rm -rf data && cp -r docs/data data
      - name: 결과 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date +%F)"
          git push
