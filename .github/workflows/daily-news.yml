name: 매일 뉴스 수집

on:
  schedule:
    - cron: "7 22,1,4,7,10,13 * * *"   # 한국시간 7·10·13·16·19·22시
  workflow_dispatch:
  push:
    paths:
      - keywords.json

permissions:
  contents: write

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CHATKU_API_KEY: ${{ secrets.CHATKU_API_KEY }}
          CHATKU_BASE_URL: ${{ secrets.CHATKU_BASE_URL }}
          CHATKU_MODEL: ${{ secrets.CHATKU_MODEL }}
          PYTHONUTF8: "1"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path docs\data | Out-Null
          if (Test-Path data) { Copy-Item -Path data\* -Destination docs\data\ -Recurse -Force }
          python fetch_news.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path data) { Remove-Item -Recurse -Force data }
          Copy-Item -Path docs\data -Destination data -Recurse
      - name: 결과 저장
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "news update $(Get-Date -Format yyyy-MM-dd)" }
          git pull --rebase --autostash
          git push
